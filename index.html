<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>차근차근 자소서 만들기</title>
</head>
<body>

<style>
/* 레이아웃: 고정 머리띠(기관·서비스명) → 단계 표시 → 질문 카드 1장 → 화면 아래에 붙는 이전/다음. 폭 600px 한 줄. */
:root{
  --bg:#f3f6f2;--surface:#ffffff;--ink:#1e2a24;--muted:#5a6a62;--line:#dfe7e1;--line-strong:#c4d1c8;
  --accent:#23604a;--accent-soft:#e4efe8;--on-accent:#ffffff;
  --pop:#e8962e;--pop-soft:#fdf0dc;--step1:#cfe2d6;--step2:#a3c9b2;--step3:#6fa88a;
  --head:#ffffff;--on-head:#1e2a24;--on-head-muted:#5a6a62;
  --warn:#9a5a00;--warn-soft:#fdf0dc;--ok:#23604a;--focus:#e8962e;
  --sans:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814;--surface:#19221d;--ink:#e6eee9;--muted:#9fb0a6;--line:#2a3830;--line-strong:#3c4d43;
  --accent:#7cc7a2;--accent-soft:#1d3329;--on-accent:#0d1a14;--head:#19221d;--on-head:#e6eee9;--on-head-muted:#9fb0a6;
  --pop:#f0ac4e;--pop-soft:#3a2c17;--step1:#25392e;--step2:#2f5140;--step3:#4b8467;
  --warn:#f0ac4e;--warn-soft:#3a2c17;--ok:#7cc7a2;--focus:#f0ac4e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814;--surface:#19221d;--ink:#e6eee9;--muted:#9fb0a6;--line:#2a3830;--line-strong:#3c4d43;
  --accent:#7cc7a2;--accent-soft:#1d3329;--on-accent:#0d1a14;--head:#19221d;--on-head:#e6eee9;--on-head-muted:#9fb0a6;
  --pop:#f0ac4e;--pop-soft:#3a2c17;--step1:#25392e;--step2:#2f5140;--step3:#4b8467;
  --warn:#f0ac4e;--warn-soft:#3a2c17;--ok:#7cc7a2;--focus:#f0ac4e;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:600px;margin:0 auto}
/* 머리띠 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--on-head);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(27,38,54,.05)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.mark{flex:none;background:#ffffff;border-radius:8px;padding:4px 6px;line-height:0;border:1px solid var(--line)}
.mark img{display:block;height:34px;width:auto;max-width:none;aspect-ratio:284/71}
.brand{min-width:0}
.brand b{display:block;font-size:20px;letter-spacing:-.02em;line-height:1.3}
.brand span{display:block;font-size:13px;color:var(--on-head-muted);line-height:1.45;margin-top:2px}
/* 단계 표시 */
.stepper{padding-block:0 10px}
@media (max-width:480px){.brandrow{display:grid!important;grid-template-columns:auto 1fr;align-items:center;column-gap:10px;row-gap:4px;padding-block:8px!important}.brand{display:contents}.brand span{grid-column:1/-1;font-size:12.5px;margin:0}.mark{padding:5px 8px;border-radius:7px}.mark img{height:30px}.brand b{font-size:17px}}
/* 본문 */
main.wrap{padding-block:18px 24px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 20px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:10px}
.meta .num{font-weight:700;color:var(--accent)}
.bar{display:none}
.speak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px;min-height:38px;flex:none}
.speak svg{width:17px;height:17px}
h1{font-size:25px;line-height:1.35;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:19px;margin:24px 0 8px;text-wrap:balance}
.help{color:var(--muted);font-size:16px;margin:0 0 16px}
.ex{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:1px 7px;font-size:15px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:440px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;text-align:left;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);font-weight:500;min-width:0}
.opt>span:first-of-type{min-width:0}
.opt::before{content:"";flex:none;width:24px;height:24px;border:2px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;font-size:16px;font-weight:700;line-height:1}
.opt.single::before{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"]::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.single[aria-pressed="true"]::before{content:"";box-shadow:inset 0 0 0 5px var(--accent-soft)}
.opts.full .opt[aria-pressed="false"]:not(.soft){opacity:.45}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:15px}
.opt.soft{border-style:dashed}
.tag{flex:none;margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px}
input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:12px 14px;min-height:54px}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
label.lbl{display:block;font-weight:700;margin:18px 0 6px;font-size:17px}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:16px;margin:14px 0}
.note b{color:var(--warn)}
.count{font-size:15px;color:var(--muted);margin-top:8px;font-weight:600}
.count.full{color:var(--accent)}
.preview{margin-top:22px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.preview h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700}
.preview ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:16px}
.preview li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.preview li span{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 6px;height:max-content;margin-top:3px;white-space:nowrap}
.preview li.empty{color:var(--muted)}
.numq{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:8px 0 12px;font-size:17px}
.numq input{width:100px;min-height:52px;text-align:center;font-size:21px;font-variant-numeric:tabular-nums}
.units{display:flex;flex-wrap:wrap;gap:6px}
.units .opt{width:auto;min-height:46px;padding:6px 14px}
.units .opt::before{display:none}
.qrow{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:10px}
.skiprow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.skiprow button{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:10px;min-height:44px;padding:0 14px;font-weight:700}
.ab{border-top:1px solid var(--line);padding:14px 0}.ab p{margin:0 0 10px;font-weight:600}.ab p span{display:block;font-size:14px;color:var(--muted)}
.ab3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ab3 button{min-height:52px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:15px}
.ab3 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.radar{width:100%;max-width:380px;display:block;margin:0 auto}
.top3{display:grid;gap:8px;margin:12px 0}.top3 div{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.top3 em{font-style:normal;color:var(--accent);font-weight:700}
.jobcard{border:1.5px solid var(--line-strong);border-radius:12px;padding:14px;margin-top:10px}.jobcard h3{margin:0 0 4px;font-size:19px}.jobcard p{margin:0 0 8px;color:var(--muted);font-size:15px}
/* 시작 화면 */
.hero{padding-block:8px}
.hero .eyebrow{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.hero h1{font-size:30px;line-height:1.3}
.lead{font-size:20px;margin:6px 0 4px;font-weight:600}
.sub{color:var(--muted);font-size:16px;margin:0 0 22px}
.startbtn{display:flex;width:100%;justify-content:center;align-items:center;gap:12px;min-height:76px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:25px;font-weight:800}
.startbtn:active{transform:translateY(2px)}
.center{text-align:center;margin:10px 0 24px}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.howto h2{margin:0 0 10px;font-size:16px;color:var(--muted)}
.flow{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:f}
.flow li{counter-increment:f;display:flex;gap:12px;align-items:center;font-size:17px}
.flow li::before{content:counter(f);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.big{display:flex;width:100%;justify-content:center;align-items:center;min-height:56px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;margin-top:12px}
.big.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.big.quiet{border:0;background:none;color:var(--muted);font-weight:500;min-height:46px}
/* 이전·다음: 화면 아래에 붙음(키보드가 열려도 함께 올라감) */
.nav{position:sticky;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.nav button{min-height:56px;border-radius:12px;font-weight:700;border:1.5px solid var(--line-strong);background:var(--surface);font-size:18px}
.nav .next{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nav .next.skip{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
/* 결과 */
.status{border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-weight:600;font-size:16px}
.status.need{background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--accent-soft);color:var(--ok)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-top:18px}
.tabs button{border:0;background:none;border-radius:9px;min-height:48px;font-size:15px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.docbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.docbar button{min-height:52px;border-radius:12px;font-weight:700;border:1.5px solid var(--line-strong);background:var(--surface)}
.docbar .main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.doctitle{font-size:20px;font-weight:800;margin:4px 0 12px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.sec h3{margin:0;background:var(--accent-soft);color:var(--accent);font-size:16px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.sec h3 small{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.sec textarea{border:0;border-radius:0;min-height:160px;padding:14px;font-size:17px;line-height:1.8;background:var(--surface)}
.sec.empty h3{background:var(--bg);color:var(--muted)}
.docbox textarea{min-height:380px;font-size:17px;line-height:1.8}
.qblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.qblock h3{margin:0 0 8px;font-size:17px}
.qblock textarea{min-height:220px;font-size:17px}
.lim{font-size:14px;margin-top:6px;font-weight:600;color:var(--muted)}
.lim.over{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row button{flex:1 1 140px;min-height:52px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700}
.row button.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.checks li i{font-style:normal;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;height:max-content;margin-top:3px}
.checks li.ok i{background:var(--accent-soft);color:var(--ok)}
.checks li.need i{background:var(--warn-soft);color:var(--warn)}
.checks li.info i{background:var(--line);color:var(--ink)}
.checks small{display:block;color:var(--muted);font-size:14px}
.sendbox{border:2px solid var(--accent);border-radius:var(--r);padding:16px;background:var(--surface)}
.sendbox h2{margin:0 0 4px}
.guide{margin-top:14px;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.guide>b{display:block;font-size:18px;margin-bottom:8px}
.guide ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.guide textarea{margin-top:10px;min-height:140px;font-size:15px}
.steps{list-style:none;counter-reset:st;padding:0!important;display:grid;gap:12px!important}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:2px 10px}
.steps li::before{content:counter(st);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.steps li b{display:inline!important;font-size:18px!important;margin:0!important}
.steps li span{font-size:15px;color:var(--muted)}
.steps li span b{font-size:inherit!important;color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;font-weight:700;padding:0;font-size:inherit}
.banner{background:var(--warn-soft);border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:16px}
.banner b{display:block;color:var(--warn)}
.small{font-size:14px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);text-align:center;padding-block:4px 16px}
.ctoggle{display:block;margin:6px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;min-height:34px}
.counselor{margin-top:16px;border:1px dashed var(--line-strong);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.counselor b{margin-right:auto}
.counselor select,.counselor button{font-size:14px;min-height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:4px 8px;width:auto}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.manual{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.manual-in{width:100%;max-width:600px;background:var(--surface);border-radius:16px;padding:18px}
.manual-in>b{display:block;font-size:18px}
.manual-in p{margin:6px 0 10px;color:var(--muted);font-size:16px}
.manual-in textarea{min-height:40vh;font-size:15px}
.stepper{padding-block:0 12px}
.prog{max-width:600px;margin:0 auto;display:grid;gap:8px;min-width:0}
.prog>*{min-width:0}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog-now{margin:0;display:flex;align-items:baseline;gap:8px;min-width:0}
.prog-n{flex:none;font-size:13px;color:var(--on-head-muted);font-variant-numeric:tabular-nums;background:var(--accent-soft);border-radius:99px;padding:1px 9px}
.prog-n b{color:var(--accent);font-size:15px}
.prog-n{background:var(--pop-soft)!important}.prog-n b{color:var(--pop)!important}
.prog-now strong{font-size:18px;color:var(--on-head);letter-spacing:-.01em}
.prog-next{margin:0;font-size:13px;color:var(--on-head-muted);flex:none}
.prog-bar{display:flex;gap:4px}
.prog-bar span{flex:1;height:8px;border-radius:99px;background:var(--line)}
.prog-bar span.done{background:var(--accent)}
.prog-bar span.now{background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,color-mix(in srgb,var(--accent) 55%,var(--head)) 5px 10px)}
.vers{margin-top:18px;display:grid;gap:8px}
.vers-h{margin:0;font-weight:700;font-size:16px}.vers-h span{color:var(--accent)}
.ver{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ver-head{display:grid;gap:2px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;min-height:56px}
.ver-t{font-weight:700;font-size:15px}.ver-p{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver.open .ver-head{background:var(--accent-soft)}
.ver-body{padding:0 14px 14px}
.ver-body pre{white-space:pre-wrap;font-family:var(--sans);font-size:15px;line-height:1.7;margin:12px 0 0;max-height:320px;overflow:auto;background:var(--bg);border-radius:10px;padding:12px}
.bname em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.01em;line-height:1.3}
.bname b{display:block}
@media (max-width:480px){.bname em{font-size:11.5px}}
.alt{margin-top:22px;border-top:1px solid var(--line);padding-top:4px}
.alt h2{margin-top:16px}
.alt .big{flex-direction:column;gap:2px;min-height:64px;text-align:center}
.alt .big small{font-weight:500;font-size:14px;color:var(--muted)}
.skipq{display:block;margin:22px 0 0 auto;border:0;background:none;color:var(--muted);font-weight:600;font-size:16px;text-decoration:underline;min-height:44px;padding:0 4px}
.prog-top{align-items:center}
.prog-menu{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--accent);border-radius:99px;font-size:14px;font-weight:700;min-height:36px;padding:0 12px}
.prog-bar{gap:4px}
.prog-bar{align-items:flex-end;height:40px}
.prog-bar .seg{flex:1;height:100%;border:0;padding:0;background:none;position:relative;cursor:pointer;border-radius:6px}
.prog-bar .seg::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,30%);border-radius:5px 5px 2px 2px;background:var(--line);transition:background .2s}
.prog-bar .seg.done::before{background:var(--step3)}
.prog-bar .seg.now::before{background:var(--accent)}
.prog-bar .seg.now::after{content:"";position:absolute;left:50%;bottom:calc(var(--h,30%) + 4px);width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 3px var(--pop-soft)}
.prog-bar .seg:not(:disabled):hover::before{filter:brightness(1.15)}
.prog-bar .seg:disabled{cursor:default}
.prog-bar span{display:none}
.prog-next{margin:-4px 0 0;text-align:right}
.prog-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prog-list button{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;text-align:left;font-size:16px}
.prog-list button.now{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.prog-list button:disabled{opacity:.5}
.prog-list button.now:disabled{opacity:1}
.pl-n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.pl-s{font-size:13px;color:var(--accent);font-weight:700}.pl-s.todo{color:var(--muted);font-weight:500}
.prog-hint{margin:0;font-size:13px;color:var(--muted)}
.hero-top{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}
.stairs{position:relative;display:flex;align-items:flex-end;gap:4px;height:92px;width:112px;margin-bottom:6px}
.stairs i{flex:1;border-radius:6px 6px 2px 2px;background:var(--step1)}
.stairs i:nth-child(1){height:28%}.stairs i:nth-child(2){height:50%;background:var(--step2)}.stairs i:nth-child(3){height:72%;background:var(--step3)}.stairs i:nth-child(4){height:94%;background:var(--accent)}
.stairs b{position:absolute;right:9px;top:-10px;width:14px;height:14px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 4px var(--pop-soft)}
.hero h1{font-size:32px}
.eyebrow{color:var(--accent)!important}
.startbtn{background:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.startbtn span{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--pop);color:#fff;font-size:22px}
.qcard{box-shadow:0 1px 2px rgba(30,42,36,.04),0 8px 24px rgba(30,42,36,.05);border-color:transparent}
.opt{border-color:var(--line-strong)}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--accent),0 2px 8px color-mix(in srgb,var(--accent) 14%,transparent)}
.flow li::before{background:var(--pop-soft)!important;color:var(--pop)!important}
.meta .num{color:var(--accent)}
.sec h3{background:var(--accent-soft)!important;color:var(--accent)!important}
.status.ok{background:var(--accent-soft)}
.tag{color:var(--pop)!important;border-color:var(--pop)!important}
@media (max-width:400px){.stairs{width:84px;height:72px}.hero h1{font-size:28px}}
</style>

const STAGES=[['기본 정보',['company','job','tasks','motive']],['해 본 일',['exptype','did']],['나의 장점',['traits','strength','ev']],['성장 과정',['value']],['나의 단점',['weak']],['마무리',['prep','posting']],['완성',['result']]];

function stageOf(name){const list=isExplore()?EXPLORE_STAGES:STAGES;const k=name.startsWith('ev')?'ev':name;const i=list.findIndex(x=>x[1].includes(k));return [i,list];}
function stageFirst(i){const [,list]=stageOf('start');const sc=screens();const st=(isExplore()?EXPLORE_STAGES:STAGES)[i];if(!st)return -1;
  const k=sc.findIndex(n=>st[1].includes(n.startsWith('ev')?'ev':n));return k;}
function goStage(i){const k=stageFirst(i);if(k<0)return;const sc=screens();if(sc[k]==='result'&&sc[idx]!=='result'){edited={};tab='doc';if(render.lastSnap&&render.lastSnap.text!==docText())keepVersion('답을 고치기 전 글',render.lastSnap);}
  if(sc[idx]==='traits')syncStrengths();stageMenu=false;idx=k;render();}
function renderStepper(name){const el=document.getElementById('stepper');if(name==='start'){el.hidden=true;return;}el.hidden=false;const [cur,list]=stageOf(name);
  if(!sampleMode)reached=Math.max(reached,cur);const nxt=list[cur+1];

  ${stageMenu?`<ol class="prog-list">${list.map((x,i)=>{const st=i===cur?'지금':i<=reached?(i<cur?'완료':'작성함'):'아직';return `<li><button type="button" data-step="${i}" ${can(i)?'':'disabled'} class="${i===cur?'now':''}"><span class="pl-n">${i+1}</span><span class="pl-t">${esc(x[0])}</span><span class="pl-s ${st==='아직'?'todo':''}">${st}</span></button></li>`;}).join('')}</ol><p class="prog-hint">이미 지나온 단계로만 갈 수 있어요. 고른 답은 그대로 남아 있습니다.</p>`:(nxt?`<p class="prog-next">다음 · ${esc(nxt[0])}</p>`:'')}</div>`;}
document.getElementById('stepper').addEventListener('click',ev=>{const b=ev.target.closest('button[data-step]');if(!b||b.disabled)return;
  if(b.dataset.step==='menu'){stageMenu=!stageMenu;renderStepper(screens()[idx]);return;}goStage(+b.dataset.step);});

function radar(sc){const cx=190,cy=170,r=118,n=sc.length;const pt=(i,v)=>{const a=(-90+i*360/n)*Math.PI/180;return [cx+Math.cos(a)*r*v,cy+Math.sin(a)*r*v];};
  const ring=v=>sc.map((_,i)=>pt(i,v).join(',')).join(' ');const poly=sc.map((s,i)=>pt(i,Math.max(s[1],0.06)/2).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 380 340" role="img" aria-label="능력 그래프"><g fill="none" stroke="var(--line)" stroke-width="1.2"><polygon points="${ring(1)}"/><polygon points="${ring(.5)}"/>${sc.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`}).join('')}</g>
  <polygon points="${poly}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${sc.map((s,i)=>{const [x,y]=pt(i,Math.max(s[1],0.06)/2);return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--accent)"/>`}).join('')}
  ${sc.map((s,i)=>{const [x,y]=pt(i,1.2);const anc=Math.abs(x-cx)<10?'middle':(x>cx?'start':'end');return `<text x="${x}" y="${y+5}" text-anchor="${anc}" font-size="14" font-weight="${s[1]===2?700:500}" fill="${s[1]===2?'var(--accent)':'var(--muted)'}" font-family="IBM Plex Sans KR,sans-serif">${esc(s[0])}</text>`}).join('')}</svg>`;}

function expParagraph(){const groups=[];const sh=new Set(),sr=new Set();
  S.strengths.forEach(k=>{const e=evOf(k);if(!hasEv(e))return;const key=e.where+'|'+e.place.trim();
    let g=groups.find(x=>x.key===key);if(!g){g={key,e:{...e,what:[]},how:[],res:[]};groups.push(g);}
    if(!g.e.period&&e.period)g.e.period=e.period;if(!g.num&&numText(e))g.num=numText(e);
    e.what.forEach(w=>{if(!g.e.what.includes(w))g.e.what.push(w);});
    e.how.forEach(h=>{if(!sh.has(h)){sh.add(h);g.how.push(h);}});e.result.filter(r=>r!=='unknown').forEach(r=>{if(!sr.has(r)){sr.add(r);g.res.push(r);}});});
  return groups.map(g=>[whatLine(g.e),g.num||'',g.num?howText(g.how).replace(/^그때 저는 /,'그때 '):howText(g.how),resText(g.res)].filter(Boolean).join(' ')).join(' ');}
function careerParagraph(){const groups=[];

    let g=groups.find(x=>x.key===key);if(!g){g={key,e:{...e,what:[]}};groups.push(g);}
    if(!g.e.period&&e.period)g.e.period=e.period;if(!g.num&&numText(e))g.num=numText(e);
    e.what.forEach(w=>{if(!g.e.what.includes(w))g.e.what.push(w);});});
  const used=groups.flatMap(g=>g.e.what);const rest=didAll().filter(d=>!used.includes(d));
  const out=groups.map(g=>[whatLine(g.e),g.num||''].filter(Boolean).join(' '));
  if(rest.length&&groups.length)out.push(`그 밖에도 ${listK(rest.slice(0,4))} 일을 해 본 적이 있습니다.`);

  return out.join(' ');}

const REQKEY=[['운전면허',/운전/],['요양보호사 자격증',/요양/],['경비원 신임교육',/경비|신임/],['지게차 운전기능사',/지게차/],['조리기능사',/조리/],['컴퓨터 관련 자격·교육',/컴퓨터|엑셀|한글|ITQ|OA/i]];
function reqHit(cert){const r=S.req.trim();if(!r)return false;const k=REQKEY.find(x=>x[0]===cert);return k?k[1].test(r):r.includes(cert);}
function classify(q){if(/실패|극복|갈등|어려(움|웠)|위기|힘들었|문제.{0,6}해결|해결한/.test(q))return 'hard';if(/성장|가치관|직업관|좌우명|생활\s*신조/.test(q))return 'growth';if(/장단점|장점|단점|성격/.test(q))return 'pers';if(/(동기|이유)/.test(q)&&/(포부|계획|입사\s*후)/.test(q))return 'mp';if(/동기|이유|지원하게|왜/.test(q))return 'motive';if(/포부|계획|입사\s*후|목표|앞으로|각오/.test(q))return 'plan';if(/경력|경험|사례|역량|직무|해\s*본|했던/.test(q))return 'career';if(/강점/.test(q))return 'strexp';if(/소개/.test(q))return 'intro';return 'unknown';}
function qAnswer(q,s){const c=classify(q);return c==='intro'?[s.growth,s.pers,s.career].filter(Boolean).join(' '):c==='mp'?s.motive+' '+s.plan:(s[c]||'');}

function checks(){const L=[];const add=(st,t,d='')=>L.push({st,t,d});
  compName()?add('ok','지원 회사: '+compName()):add('need','지원할 회사가 정해지지 않았어요','지금은 연습용입니다. 회사가 정해지면 회사 이름을 넣고 다시 만드세요.');
  add('ok','지원 직무: '+jobName());
  postTasks().length?add('ok','공고 업무 반영: '+postTasks().join(', ')):add('need','채용공고의 주요 업무를 확인해야 해요','공고에 적힌 업무를 넣어야 지원 동기가 구체적이 됩니다.');
  if(S.hasQ==='yes'&&!activeQs().length)add('need','공고 질문이 있다고 했지만 질문을 적지 않았어요','지금은 일반 자기소개서로 만들었습니다. 공고의 질문을 적으면 질문별로 나눠 만듭니다.');
  if(S.hasQ==='unk'||!S.hasQ)add('need','공고에 자기소개서 질문이 있는지 확인하세요','질문이 있으면 그 질문에 맞춰 나눠 써야 합니다.');
  activeQs().forEach(q=>{const c=classify(q.q);if(c==='hard')add('need',`${J('질문 '+(q.i+1),'은/는')} 실제로 겪은 어려운 일을 묻고 있어요`,`“${q.q}” — 고른 답만으로는 쓸 수 없어 비워 두었습니다. 담당자와 실제 있었던 일을 이야기해 보고 써 주세요.`);else if(c==='unknown')add('need',`${J('질문 '+(q.i+1),'은/는')} 자동으로 답을 만들지 못했어요`,`“${q.q}” — 담당자와 함께 직접 써 주세요.`);
    const lim=parseInt(q.lim,10);const t=edited['q'+q.i]??qAnswer(q.q,build().s);if(lim&&t.length>lim)add('need',`${J('질문 '+(q.i+1),'이/가')} 글자 수를 ${t.length-lim}자 넘었어요`,`제한 ${lim}자, 지금 ${t.length}자(공백 포함)입니다.`);});
  if(compName()&&!S.creason.length&&!S.creasonText.trim())add('need','이 회사에 지원한 이유가 없어요','회사 이름만 바꾸면 다른 곳에도 낼 수 있는 글이 됩니다. 근무 시간, 위치, 소개받은 경로처럼 실제 이유를 하나 넣어 보세요.');
  S.motives.filter(x=>x!=='unsure').length?add('ok','지원 이유 반영'):add('need','지원 이유가 정해지지 않았어요','담당자와 함께 이 회사, 이 일을 고른 이유를 정해 보세요.');
  if(!S.strengths.length)add('need','강점을 고르지 않았어요');
  if(!build().s.career)add('need','‘경력 및 관련 경험’ 칸이 비어 있어요','직장 경력이 아니어도 됩니다. 아르바이트, 가게 일, 봉사, 집안일·가족 돌봄 중 이 일과 비슷하게 해 본 일을 상담에서 함께 찾아보세요.');
  if(!S.princ)add('need','‘성장과정’ 칸이 비어 있어요','일하면서 지켜 온 원칙을 하나 고르면 채워집니다.');else if(!S.origin||S.origin==='unk')add('need','원칙이 생긴 계기가 없어요','“그렇게 하게 된 일”을 상담에서 하나 떠올려 보면 성장과정이 훨씬 살아납니다.');
  if(!S.weak||S.weak==='none')add('info','단점은 고르지 않았어요','공고에 ‘성격의 장단점’ 문항이 있으면, 직무에 크게 문제 되지 않는 단점 하나와 고쳐 가는 방법을 상담에서 정해 보세요.');else if(S.fix==='not')add('need','단점을 고치는 방법이 없어요','다짐보다 실제로 하고 있는 행동이 있으면 좋습니다.');
  S.strengths.forEach(k=>{const e=evOf(k);if(!realExp().length)add('info',`‘${k}’은 경험 없이 앞으로의 다짐으로 썼어요`);
    else if(!hasEv(e))add('need',`‘${k}’의 근거 경험이 비어 있어요`,'실제로 그렇게 했던 경험을 골라야 설득력이 생깁니다.');
    else if(!e.result.filter(x=>x!=='unknown').length)add('need',`‘${k}’의 결과가 비어 있어요`,'결과가 없어도 제출할 수는 있지만, 있으면 더 좋아요. 없는 결과는 만들지 마세요.');
    else add('ok',`‘${k}’ 강점 → 경험 → 결과 연결됨`);});
  const extra=S.traits.filter(k=>!S.strengths.includes(k));if(extra.length)add('info','그 밖에 고른 태도: '+extra.join(', '),'자기소개서에는 넣지 않았습니다. 면접에서 “장점이 뭐예요?” 같은 질문에 활용하세요.');
  if(S.req.trim()){const have=[...S.certs.filter(c=>c!=='nocert').map(c=>CERTS.find(x=>x[0]===c)[1]),S.certOther.trim()].filter(Boolean);
    const miss=REQKEY.filter(k=>k[1].test(S.req)&&!have.includes(k[0])).map(k=>k[0]);
    if(miss.length)add('need','공고 자격요건을 확인하세요: '+miss.join(', '),'공고에 적혀 있지만 자격증 화면에서 고르지 않았어요. 가지고 있다면 골라 주시고, 없다면 지원 가능한지 확인하세요.');
    else add('info','공고 자격요건: '+S.req.trim(),'가지고 있는 자격은 본문에 “공고에서 요구하는”으로 넣었습니다.');}
  if(S.expTypes.includes('rest'))add('info','일을 오래 쉰 기간이 있어요','자기소개서에는 쓰지 않았습니다. 면접에서 공백기 질문이 나올 수 있으니 답을 함께 준비해 보세요.');
  if(!S.skipAbility&&Object.keys(S.ability).length)add('info','능력 체크는 본인이 스스로 답한 것입니다','검사 결과가 아니므로 자기소개서에는 넣지 않았습니다.');
  return L;}

function counter(t,lim){const n=t.length,m=t.replace(/\s/g,'').length;const l=parseInt(lim,10);
  return `<div class="lim${l&&n>l?' over':''}">${l?`${n.toLocaleString()} / ${l.toLocaleString()}자 (공백 포함)${n>l?` · ${n-l}자 줄여야 해요`:''}`:`${n.toLocaleString()}자 (공백 포함)`} · 공백 빼고 ${m.toLocaleString()}자</div>`;}
function today(){const d=new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function askList(){const q=[];const evs=S.strengths.map(k=>[k,evOf(k)]).filter(([,e])=>hasEv(e));
  if(compName()&&!S.creason.length&&!S.creasonText.trim())q.push('같은 일을 하는 다른 곳 중에 왜 여기인가요?');
  if(evs.length&&!evs.some(([,e])=>numText(e)))q.push('그 일을 할 때 하루에 몇 건·몇 명·몇 곳 정도 맡으셨나요?');
  if(evs[0])q.push(`‘${evs[0][0]}’을 보여 준 그 일에서, 맨 처음 한 행동이 무엇이었나요?`);
  if(!evs.length&&realExp().length)q.push('지금까지 해 본 일 중 이 일과 가장 비슷한 일은 무엇이었나요?');
  if(activeQs().some(x=>classify(x.q)==='hard'))q.push('일하면서 잘 안 됐던 일과, 그때 바꾼 점이 있나요?');
  q.push('이 자기소개서 내용을 면접에서 3분 동안 말할 수 있나요?');return q.slice(0,4);}
function sendText(){const b=build();const qs=activeQs();
  const body=qs.length?qs.map(q=>`${q.i+1}. ${q.q}${q.lim?` (${q.lim}자 이내)`:''}\n${edited['q'+q.i]??qAnswer(q.q,b.s)}`).join('\n\n'):fullDoc();
  const need=checks().filter(c=>c.st==='need').map(c=>'- '+c.t);
  return ['[자기소개서 제출]',...(S.sendName.trim()?[`이름: ${S.sendName.trim()}`]:[]),`작성일: ${today()}`,'',body,'',need.length?'[보완할 점]\n'+need.join('\n'):'[보완할 점] 없음','','[상담 때 물어볼 질문]',...askList().map((x,i)=>`${i+1}. ${x}`)].join('\n');}
function exploreText(){const top=exploreRank();const L=x=>x.length?x.join(', '):'없음';
  return ['[직무 탐색 결과]',...(S.sendName.trim()?[`이름: ${S.sendName.trim()}`]:[]),`작성일: ${today()}`,'',
   `좋아하는 일: ${L(S.like.map(k=>LIKES.find(x=>x[0]===k)?.[1]).filter(Boolean))}`,
   `일하는 조건: ${L(S.cond.map(k=>CONDS.find(x=>x[0]===k)?.[1]).filter(Boolean))}`,
   `해 본 경험: ${L(EXPTYPES.filter(x=>S.expTypes.includes(x[0])).map(x=>x[1]))}`,
   `해 본 일: ${L(didAll())}`,
   `추천된 직무: ${L(top.map(t=>t.job))}`,'','추천된 직무 중 마음에 드는 일이 없어, 담당자와 상담하며 정하고 싶습니다.'].join('\n');}
const skipLink=()=>`<button type="button" class="skipq" data-act="skipQ">이 질문은 건너뛸게요 →</button>`;
function sendBox(){return `<div class="sendbox"><h2>담당자에게 보내기</h2>
  <p class="help" style="margin-bottom:10px">다 고친 뒤 이 버튼을 누르고, 문자로 보내 주세요.</p>
  <label class="lbl" for="sendName" style="margin-top:0">이름 (담당자가 알아볼 수 있게)</label>${txt('sendName',S.sendName,'예: 홍길동')}
  <button type="button" class="big main" data-act="send">담당자에게 보내기</button>
  <div class="guide" id="sendGuide" hidden></div></div>`;}
function showGuide(copied,txt){const g=document.getElementById('sendGuide');if(!g)return;g.hidden=false;
  g.innerHTML=(copied?`<b>내용을 복사했어요. 이제 문자에 붙여 넣으세요.</b>`:`<b>아래 글을 길게 눌러 ‘전체 선택’ → ‘복사’를 누르세요.</b>`)+
  `<ol class="steps">
   <li><b>담당자가 보낸 문자로 돌아갑니다.</b><span>삼성 휴대폰: 화면 맨 아래 <b>뒤로 ◁</b> 버튼을 누르세요.<br>아이폰: 화면 왼쪽 맨 위 <b>◀ 메시지</b>를 누르세요.</span></li>
   <li><b>글 쓰는 칸을 꾹 누릅니다.</b><span>1~2초 동안 손가락을 떼지 마세요.</span></li>
   <li><b>‘붙여넣기’를 누릅니다.</b><span>자기소개서 글이 칸에 들어갑니다.</span></li>
   <li><b>보내기를 누릅니다.</b></li></ol><p class="small" style="margin:8px 0 0">글이 길어도 괜찮습니다. 한 번에 보내집니다. 돌아가는 방법을 모르겠으면, 문자 앱을 직접 열고 담당자가 보낸 문자를 눌러도 됩니다.</p>`+
  (copied?'':`<textarea id="sendRaw" readonly>${esc(txt||sendText())}</textarea>`);
  g.scrollIntoView({behavior:'smooth',block:'nearest'});if(!copied){const r=document.getElementById('sendRaw');r.focus();r.select();}}
/* 워드(.docx) 만들기: 워드가 만드는 기본 구성(문서·스타일·설정·문서 정보)을 갖춘 zip */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function deflateRaw(u){try{if(typeof CompressionStream==='undefined')return null;const cs=new CompressionStream('deflate-raw');const out=new Response(new Blob([u]).stream().pipeThrough(cs));return new Uint8Array(await out.arrayBuffer());}catch(e){return null;}}
async function zipFiles(files){const enc=new TextEncoder();const parts=[];const cen=[];let off=0;
  const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  const d=new Date();const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const [name,text] of files){const nm=enc.encode(name),raw=enc.encode(text),crc=crc32(raw);const z=await deflateRaw(raw);const m=z?8:0,data=z||raw;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0),...u16(m),...u16(dt),...u16(dd),...u32(crc),...u32(data.length),...u32(raw.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,data);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0),...u16(m),...u16(dt),...u16(dd),...u32(crc),...u32(data.length),...u32(raw.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+data.length;}
  const cenLen=cen.reduce((a,x)=>a+x.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenLen),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});}
function xmlEsc(t){return String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function makeDocx(text){const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';const W='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const para=(t,style)=>`<w:p>${style?`<w:pPr><w:pStyle w:val="${style}"/></w:pPr>`:''}<w:r><w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r></w:p>`;
  const lines=text.split('\n');const body=lines.map((l,i)=>{const x=l.trim();if(!x)return '';if(i===0)return para(x,'Title');if(/^\[.*\]$/.test(x)||(/^\d+\.\s/.test(x)&&!lines[i-1].trim()))return para(x.replace(/^\[|\]$/g,''),'Heading1');return para(l,'');}).join('')||'<w:p/>';
  const now=new Date().toISOString().replace(/\.\d+Z$/,'Z');
  const F='<w:rFonts w:ascii="Malgun Gothic" w:eastAsia="Malgun Gothic" w:hAnsi="Malgun Gothic" w:cs="Malgun Gothic"/>';
  return zipFiles([
   ['[Content_Types].xml',X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>'],
   ['_rels/.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>'],
   ['docProps/core.xml',X+`<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>자기소개서</dc:title><dc:creator>차근차근 자소서 만들기</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`],
   ['docProps/app.xml',X+'<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Microsoft Office Word</Application></Properties>'],

function legacyCopy(text){const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}t.remove();return ok;}

function qsDoc(){const b=build();return activeQs().map(q=>`${q.i+1}. ${q.q}${q.lim?` (${q.lim}자 이내)`:''}\n${edited['q'+q.i]??qAnswer(q.q,b.s)}`).join('\n\n');}

function keepVersion(why,snap){const v=snap?{...snap}:snapshot();if(versions.length&&versions[0].text===v.text)return;const d=new Date();v.at=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;v.why=why;versions.unshift(v);versions=versions.slice(0,5);}
function restoreVersion(i){const v=versions[i];if(!v)return;keepVersion('되돌리기 전 글');const w=versions[versions.indexOf(v)];edited={};w.secs.forEach((t,k)=>{edited['sec'+k]=t;});Object.entries(w.qs).forEach(([k,t])=>{edited['q'+k]=t;});edited.talk=w.talk;openVer=-1;}

  else{const t=edited.talk??b.talk;body=`<div class="docbox" style="margin-top:14px"><label class="small" for="draft">면접에서 “장점이 무엇인가요?”라고 물을 때 이 순서대로 말해 보세요.</label><textarea id="draft" data-ed="talk">${esc(t)}</textarea></div><div class="row"><button type="button" class="main" data-act="copy" data-src="draft">복사하기</button></div>`;}
  return `${banner}<h1>${need?'자기소개서 초안이 만들어졌습니다':'자기소개서가 만들어졌습니다'}</h1>

app.addEventListener('input',ev=>{const el=ev.target;
  if(el.dataset.ed){edited[el.dataset.ed]=el.value;clearTimeout(render.st);render.st=setTimeout(()=>{if(!sampleMode)render.lastSnap=snapshot();},400);const c=document.getElementById('c_'+el.dataset.ed);if(c){if(el.dataset.ed.startsWith('sec'))c.textContent=el.value.trim().length+'자';else c.innerHTML=counter(el.value,el.dataset.lim||'');}return;}
  if(el.dataset.q){S.qs[+el.dataset.q][el.dataset.k]=el.dataset.k==='lim'?el.value.replace(/[^0-9]/g,''):el.value;if(el.dataset.k==='lim')el.value=S.qs[+el.dataset.q].lim;return;}
  const f=el.dataset.f;if(!f)return;if(f==='nDay'||f==='nTeam'){el.value=el.value.replace(/[^0-9]/g,'').slice(0,4);}
  if(f==='nDay'&&el.dataset.ev&&el.value&&!evOf(el.dataset.ev).unit){let u=defaultUnit();if(!UNITS.includes(u))u='건';evOf(el.dataset.ev).unit=u;document.querySelectorAll('.units .opt').forEach(o=>o.setAttribute('aria-pressed',o.dataset.v===u));}if(el.dataset.ev){evOf(el.dataset.ev)[f]=el.value;updatePreview();}else S[f]=el.value;updateNext();});
document.getElementById('prev').onclick=()=>{idx=Math.max(0,idx-1);render();};
document.getElementById('next').onclick=()=>{const sc=screens();const name=sc[idx];
  if(name==='company'&&!S.company.trim()&&!S.noCompany){toast('회사 이름을 적거나 ‘아직 정하지 않았어요’를 눌러 주세요.');return;}
  if(name==='job'&&!answered('job')){toast('지원할 일을 하나 골라 주세요.');return;}
  if(name==='traits'&&!S.traits.length){toast('나에게 해당하는 태도를 하나 이상 골라 주세요.');return;}
  if(name.startsWith('evA')&&realExp().length){const e=evOf(S.strengths[+name.slice(3)]);
    if(e.where&&!e.what.length&&didAll().length){toast('무엇을 했는지도 하나 골라 주세요. 건너뛰려면 위에서 고른 ‘어디에서’를 한 번 더 눌러 빼 주세요.');return;}
    if(!e.where&&e.what.length){toast('어디에서 그랬는지도 하나 골라 주세요.');return;}}
  if(name==='strength'&&!S.strengths.length){toast('대표 강점을 1개 이상 골라 주세요.');return;}
  if(name==='traits')syncStrengths();
  const nx=screens();const ni=Math.min(nx.length-1,nx.indexOf(name)+1);if(nx[ni]==='result'){edited={};tab='doc';if(render.lastSnap&&render.lastSnap.text!==docText())keepVersion('답을 고치기 전 글',render.lastSnap);}idx=ni;render();};
function speak(){try{const t=(document.getElementById('qTitle')?.textContent||'')+'. '+(document.getElementById('qHelp')?.textContent||'');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u);}catch(e){toast('이 기기에서는 소리로 듣기를 쓸 수 없어요.');}}

function sampleState(){const s=blank();Object.assign(s,{company:'햇살요양원',job:'미화·청소',tasks:['사무실·공용공간 청소','화장실 청소','분리수거'],hasQ:'no',motives:['exp','long'],expTypes:['job','rest'],did:['사무실·공용공간 청소','화장실 청소','분리수거','청소도구 관리'],skipAbility:true,princ:'finish',origin:'senior',weak:'slow',fix:'order',traits:['책임감','성실성','주인의식'],strengths:['책임감','성실성'],prep:['counsel','commute'],certs:['nocert']});
  s.ev['책임감']={where:'job',place:'시청 앞 상가건물',period:'y5',what:['화장실 청소','분리수거'],how:['check','finish'],result:['trusted']};
  s.ev['성실성']={where:'job',place:'시청 앞 상가건물',period:'y5',what:['화장실 청소','분리수거'],how:['punctual','prepare'],result:['long']};return s;}

render();
})();
